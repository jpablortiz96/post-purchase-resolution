<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant · Return requests</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300b894'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0d12;--card:#16161f;--raised:#1c1c28;--bd:rgba(255,255,255,.08);
    --tx:#f0f0f5;--tx2:#b8b8c8;--mut:#7a7a8c;--ok:#00b894;--warn:#fdcb6e;--dgr:#e17055;--r:14px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:12.5px;color:var(--mut);margin-bottom:24px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:100px;
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip--live{background:rgba(0,184,148,.12);border:1px solid rgba(0,184,148,.3);color:var(--ok)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;margin-bottom:16px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:11px}
  .row{display:flex;gap:12px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--bd)}
  .row:last-child{border-bottom:none}
  .k{color:var(--mut);min-width:132px;flex-shrink:0;font-size:12.5px}
  .v{color:var(--tx)}
  .title{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-bottom:3px}
  .note{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;
    background:rgba(253,203,110,.08);border:1px solid rgba(253,203,110,.2);color:#f5d9a0}
  .status{display:inline-block;padding:5px 12px;border-radius:7px;font-family:'SF Mono',ui-monospace,monospace;
    font-size:12.5px;margin-top:4px}
  .status--REQUESTED{background:rgba(253,203,110,.12);border:1px solid rgba(253,203,110,.3);color:var(--warn)}
  .status--OPEN{background:rgba(0,184,148,.12);border:1px solid rgba(0,184,148,.3);color:var(--ok)}
  .status--none{background:var(--raised);border:1px solid var(--bd);color:var(--mut)}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
  .btn{padding:10px 19px;border-radius:9px;border:1px solid transparent;font-family:inherit;
    font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .go{background:var(--ok);color:#04140f}.go:hover:not(:disabled){filter:brightness(1.1)}
  .ghost{background:transparent;border-color:var(--bd);color:var(--mut);font-size:12.5px;padding:8px 15px}
  .ghost:hover{color:var(--tx2)}
  .err{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13px;
    background:rgba(225,112,85,.1);border:1px solid rgba(225,112,85,.25);color:#f0b8a4}
  .empty{padding:18px 0;text-align:center;color:var(--mut);font-size:13.5px}
  .foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut)}
  .foot a{color:var(--tx2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Return requests</h1>
    <div class="chip chip--live" id="badge">Shopify · Live</div>
  </div>
  <div class="sub">Merchant decision desk. Approving here writes to Shopify.</div>
  <div id="desk"><div class="card"><div class="empty">Loading from Shopify…</div></div></div>
  <div id="queue"></div>
  <div class="foot">
    Development store. Test data only — no real money moves.
    · <a href="/">Customer view</a>
  </div>
</div>
<script type="module" src="./src/merchant.js"></script>
</body>
</html>
